name: Deploy

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Firebase Hosting releases are not safe to run concurrently against one live
# channel. Queue newer runs instead of racing two production deployments.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: skat-server
  FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name ==
      'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    outputs:
      backend-url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Build and deploy backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_ADDR: ${{ secrets.REDIS_ADDR }}
        run: |
          gcloud builds submit ./backend \
            --project=$PROJECT_ID \
            --config=backend/cloudbuild.yaml \
            --substitutions="^|^_SERVICE_NAME=$SERVICE_NAME|_REGION=$REGION|_IMAGE_TAG=$GITHUB_SHA|_DATABASE_URL=$DATABASE_URL|_CORS_ORIGIN=https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app|_GCS_BUCKET=skat-ai-qtables|_REDIS_ADDR=$REDIS_ADDR"

      - name: Get Backend URL
        id: deploy
        run: |
          echo "url=$(gcloud run services describe $SERVICE_NAME --project $PROJECT_ID --region $REGION --format 'value(status.url)')" >> $GITHUB_OUTPUT

      - name: Output Backend URL
        run: echo "Backend deployed to ${{ steps.deploy.outputs.url }}"

  deploy-frontend:
    name: Deploy Frontend to Firebase
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name ==
      'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Get Backend URL
        id: backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe $SERVICE_NAME --project $PROJECT_ID --region $REGION --format 'value(status.url)')
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Create production env file
        working-directory: frontend
        run: |
          echo "VITE_API_URL=${{ steps.backend-url.outputs.url }}" > .env.production
          echo "VITE_WS_URL=${{ steps.backend-url.outputs.url }}" | sed 's/https/wss/g' >> .env.production
          cat .env.production

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: "./frontend"
          # 15.22.2 introduced an API retry that can re-submit a successful
          # release after a premature connection close (fixed version: TBD).
          firebaseToolsVersion: 15.22.1
