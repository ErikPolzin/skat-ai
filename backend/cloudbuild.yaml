steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--timeout=${_REQUEST_TIMEOUT}'
      - '--set-env-vars=^|^DATABASE_URL=${_DATABASE_URL}|CORS_ORIGIN=${_CORS_ORIGIN}|LOG_LEVEL=INFO|GCS_BUCKET=${_GCS_BUCKET}|CLOUD_LOGGING_ENABLED=true|ASSUME_NO_MOVING_GC_UNSAFE_RISK_IT_WITH=go1.25|CACHE_BACKEND=redis|REDIS_ADDR=${_REDIS_ADDR}|CACHE_TTL=30m'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

substitutions:
  _SERVICE_NAME: 'skat-server'
  _REGION: 'us-central1'
  _IMAGE_TAG: 'manual'
  _CORS_ORIGIN: 'https://skat-ai-6fa5a.web.app'
  _GCS_BUCKET: 'skat-ai-qtables'
  _DATABASE_URL: ''
  _REDIS_ADDR: ''
  _REQUEST_TIMEOUT: '3600s'
